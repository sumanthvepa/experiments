[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mws"
version = "0.1.0"
description = "A Starlette web service illustrating the use of middleware"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "starlette",
  "uvicorn"
]

[project.optional-dependencies]
dev = [
  "httpx",
  "mypy",
  "pylint",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["mws*"]
# mws is a namespace package: it has no __init__.py files.
namespaces = true

